name: Windows desktop
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'scripts/electron-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:electron
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Ordo-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish direct-download Windows installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          Copy-Item $installer.FullName 'release/Ordo-Windows-Setup.exe' -Force
          gh release view windows-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --title 'Ordo for Windows (preview)' --notes 'Unsigned Windows x64 preview installer. Built from the Android editor core; Windows export and full feature parity require device testing.' --prerelease --target ${{ github.sha }}
          }
          gh release edit windows-latest --title 'Ordo for Windows (preview)' --notes-file docs/WINDOWS-RELEASE.md --prerelease --target ${{ github.sha }}
          gh release upload windows-latest 'release/Ordo-Windows-Setup.exe' --clobber
